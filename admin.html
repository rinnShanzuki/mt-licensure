<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab Level-Up - Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .admin-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    .code-display {
      font-family: monospace;
      font-size: 24px;
      letter-spacing: 2px;
      background: var(--surface);
      border: 1px dashed var(--stamp);
      padding: 20px;
      text-align: center;
      margin: 20px 0;
      color: var(--gold);
      user-select: all;
    }
    .history-list {
      margin-top: 30px;
      text-align: left;
    }
    .history-item {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-code {
      font-family: monospace;
      color: var(--text);
    }
    .history-status {
      font-size: 0.9em;
    }
    .status-unused { color: var(--green); }
    .status-used { color: var(--stamp); }

    /* Table Styles */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-family: monospace;
      font-size: 14px;
      text-align: left;
    }
    .admin-table th {
      color: var(--stamp);
      padding: 10px;
      border-bottom: 1px dashed var(--border);
      font-weight: normal;
    }
    .admin-table td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--surface2);
      color: var(--text-muted);
    }
    .admin-table tr:hover td {
      background-color: var(--surface2);
    }
  </style>
</head>
<body>
  
  <div id="app">
    <div class="admin-container gate-card">
      <div class="eyebrow" style="color:var(--stamp)">Admin Login</div>
      <h1>LAB LEVEL-UP</h1>
      <p class="gate-sub">Enter your admin credentials to access the code generator.</p>
      <form id="admin-login-form">
        <input id="admin-email" class="gate-input" type="email" autocomplete="email" required placeholder="Admin Email" aria-label="Email">
        <input id="admin-password" class="gate-input" type="password" autocomplete="current-password" required placeholder="Password" aria-label="Password" style="margin-top: 10px;">
        <button class="btn" type="submit" style="margin-top: 15px;">Log In →</button>
      </form>
      <div id="admin-error" class="gate-error" aria-live="polite"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/utils.js"></script>
  <script src="js/services/supabase-client.js"></script>
  <script src="js/services/auth-service.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
